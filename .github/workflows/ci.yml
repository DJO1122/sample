name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Smoke test (links, overflow, accessibility)
        run: |
          npm start -- -p 3000 &
          npx --yes wait-on@8.0.3 http://localhost:3000 --timeout 60000
          npm run smoke
